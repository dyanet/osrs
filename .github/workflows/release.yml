name: Release

# Releases com.dyanet.osrs to Maven Central when a version bump lands on master
# (or a release/** branch). Pushes that don't change the version do nothing:
# the job checks whether v<version> is already tagged.
#
# The upload goes to the Sonatype Central Portal with autoPublish=false. It is
# validated there (signatures, POM, javadoc/sources) and then waits: a
# maintainer clicks **Publish** at central.sonatype.com > Deployments to make
# it public, or **Drop** to discard it.
#
# Secrets (repo or org level):
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD  Central Portal user token
#   MAVEN_GPG_PRIVATE_KEY  ASCII-armored secret key (gpg --armor --export-secret-keys)
#   MAVEN_GPG_PASSPHRASE   its passphrase (empty if the key has none)
on:
  push:
    branches: [master, "release/**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # to tag the released commit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes <server id="central"> into settings.xml from these env vars;
          # the central-publishing plugin fails without that server entry.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      - name: Decide whether to release
        id: rel
        env:
          HAS_TOKEN: ${{ secrets.CENTRAL_TOKEN_USERNAME != '' && secrets.MAVEN_GPG_PRIVATE_KEY != '' }}
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "$VERSION is a snapshot - nothing to release."; echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged - nothing to release."; echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::v$VERSION is not released, but the Central/GPG secrets are not set - skipping. See release.yml for the secrets it needs."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Releasing $VERSION to Maven Central."; echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, test, sign and upload to the Central Portal
        if: steps.rel.outputs.release == 'true'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease deploy

      - name: Tag the release commit
        if: steps.rel.outputs.release == 'true'
        run: |
          TAG="v${{ steps.rel.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "::notice title=Publish on Central::com.dyanet.osrs $TAG is validated on central.sonatype.com > Deployments. Click Publish to release it."
