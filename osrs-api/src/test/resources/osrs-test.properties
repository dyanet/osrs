# Test-scope OpenSRS "test" (horizon) configuration used by the unit/integration
# tests. This lives in src/test/resources so it takes precedence over the packaged
# template on the test classpath and is never shipped in the jar.
#
# Never commit a real key here (this repository is public). For the opt-in
# integration tests (mvn verify -Pintegration), point OSRS_CONFIG (or
# -Dosrs.config) at a private copy with your horizon credentials instead.
osrs.environment=test
osrs.protocol=https
osrs.host=horizon.opensrs.net
osrs.port=80
osrs.sslPort=55443
osrs.userName=dyanet
osrs.password=none
osrs.key=your-opensrs-test-api-key
osrs.version=0.9
osrs.baseClassVersion=0.9.1
