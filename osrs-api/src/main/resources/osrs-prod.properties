# OpenSRS production environment configuration.
#
# This is a template shipped with the library. Fill in your reseller username
# and API key, or point the JVM at an external copy with:
#   -Dosrs.config=/path/to/osrs-prod.properties
# Activate with -Dosrs.env=prod.
osrs.environment=prod
osrs.protocol=https
osrs.host=rr-n1-tor.opensrs.net
osrs.port=80
osrs.sslPort=55443
osrs.userName=your_reseller_username
osrs.password=none
osrs.key=your_api_key
osrs.version=0.9
osrs.baseClassVersion=0.9.1
