# OpenSRS "test" (horizon) environment configuration.
#
# This is a template shipped with the library. Fill in your reseller username
# and API key, or point the JVM at an external copy with:
#   -Dosrs.config=/path/to/osrs-test.properties
# Select a different environment file with -Dosrs.env=<env> (default: test).
osrs.environment=test
osrs.protocol=https
osrs.host=horizon.opensrs.net
osrs.port=80
osrs.sslPort=55443
osrs.userName=your_reseller_username
osrs.password=none
osrs.key=your_api_key
osrs.version=0.9
osrs.baseClassVersion=0.9.1
